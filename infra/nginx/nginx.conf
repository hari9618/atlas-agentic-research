# Atlas load balancer — nginx in front of N stateless API replicas.
#
#   docker compose --profile scale up --scale api=3
#
# Why the API can sit behind this with no sticky sessions:
#   * auth is a self-contained JWT → any replica verifies any request;
#   * run state is checkpointed in Postgres → a review can be resumed on a different
#     replica than the one that drafted it (run ids are user-scoped, see research.py);
#   * rate limits and run leases live in Redis → quotas are global, not per replica.

worker_processes auto;
events { worker_connections 4096; }

http {
  # Docker's embedded DNS. `resolve` (open-source nginx >= 1.27.3) re-resolves the
  # service name, so replicas added/removed by `--scale` join/leave without a reload.
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream atlas_api {
    zone atlas_api 64k;
    # Runs are long SSE streams of very different lengths: send each new request to
    # the replica with the fewest open connections, not round-robin.
    least_conn;
    server api:8000 resolve max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  # Edge shield: a coarse per-IP cap before traffic reaches Python. The API's own
  # limits (per account / plan, shared via Redis) are the fine-grained layer.
  limit_req_zone $binary_remote_addr zone=per_ip:10m rate=30r/s;
  limit_req_status 429;
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

  log_format main '$remote_addr "$request" $status $body_bytes_sent '
                  'rt=$request_time upstream=$upstream_addr ust=$upstream_status '
                  'rid=$request_id';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  server {
    listen 80;
    client_max_body_size 11m;   # corpus uploads are capped at 10 MB by the API
    server_tokens off;

    location = /lb-health { access_log off; return 200 "ok\n"; }

    location / {
      limit_req zone=per_ip burst=60 nodelay;
      limit_conn conn_per_ip 20;

      proxy_pass http://atlas_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";            # reuse upstream keepalive connections
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id; # the API logs and echoes it

      # A replica that refuses the connection or is full (503) → try another one.
      # nginx never retries once a response has started, and never retries POSTs, so
      # a run is never started twice.
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
      proxy_connect_timeout 5s;
    }

    # SSE: stream every event as it happens, and keep the connection open for a run
    # that legitimately takes minutes.
    location /research/ {
      limit_req zone=per_ip burst=20 nodelay;
      proxy_pass http://atlas_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_next_upstream error timeout http_503;
      proxy_next_upstream_tries 2;
      proxy_connect_timeout 5s;
    }
  }
}
