# Render Blueprint for the Atlas backend (FastAPI).
# The Next.js frontend deploys separately on Vercel (root dir: apps/web).
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: atlas-api
    runtime: python
    plan: free
    rootDir: apps/api
    # Install the package (and its deps) from apps/api/pyproject.toml.
    buildCommand: pip install --upgrade pip && pip install -e .
    # Render provides $PORT; bind to it and to all interfaces.
    startCommand: uvicorn atlas.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Required — paste your Groq key in the Render dashboard (kept secret).
      - key: GROQ_API_KEY
        sync: false
      # The Vercel frontend origin allowed to call this API.
      - key: CORS_ORIGINS
        value: "https://atlas-web-lake.vercel.app"
      # The free tier (512 MB) can't hold the neural bge embedder + cross-encoder
      # reranker (they OOM-crash the container). This flag switches retrieval to the
      # lightweight BM25 + hashing path. The Groq LLM reasoning is unchanged; the full
      # neural pipeline still runs locally / on a larger instance (flag off).
      - key: ATLAS_OFFLINE_EMBED
        value: "1"
      # SEC EDGAR asks for a contact string in the User-Agent header.
      - key: SEC_EDGAR_USER_AGENT
        value: "atlas-research harithota609@gmail.com"
