# Atlas local stack — bring up with: cp .env.example .env && docker compose up
# Free / self-hostable components only: Qdrant + Postgres + Redis + self-hosted Langfuse
# + nginx load balancer + N api replicas + web.
#   docker compose up -d --scale api=3     # three API replicas behind the balancer
name: atlas

services:
  # ---- Vector store -----------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- Postgres (durable Atlas state) ------------------------------------
  # LangGraph checkpoints (paused human-review runs), episodic memory and the
  # prompt registry. Separate from langfuse-db so either can be reset alone.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_dev_pw   # DEV ONLY — change for any real use
      POSTGRES_DB: atlas
    ports:
      - "5433:5432"   # host 5433 avoids clashing with a locally installed Postgres
    volumes:
      - atlas_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- Langfuse (observability) + its Postgres --------------------------
  langfuse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse_dev_pw   # DEV ONLY — change for any real use
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3001:3000"   # host 3001 → matches LANGFUSE_HOST in .env.example
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse_dev_pw@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: dev_nextauth_secret_change_me      # DEV ONLY
      SALT: dev_salt_change_me                            # DEV ONLY
      TELEMETRY_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/public/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---- Redis (shared rate limits + run leases across API replicas) -------
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb",
              "--maxmemory-policy", "volatile-ttl"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ---- Atlas API (FastAPI) — stateless, scale with `--scale api=3` ------
  # No host port: every request enters through the load balancer below, so adding
  # replicas never collides on a port and every replica gets traffic.
  api:
    build: ./apps/api
    expose:
      - "8000"
    env_file:
      - ./apps/api/.env
    environment:
      # Override the localhost defaults from .env for in-container networking:
      QDRANT_URL: http://qdrant:6333
      LANGFUSE_HOST: http://langfuse:3000
      DATABASE_URL: postgresql://atlas:atlas_dev_pw@postgres:5432/atlas
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./apps/api:/app          # dev hot-reload
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn atlas.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips=*
    restart: unless-stopped

  # ---- Load balancer (nginx) — the API's front door on :8000 ------------
  # least_conn across replicas, SSE-safe proxying, edge rate limit, failover on a
  # full (503) or dead replica. Config: infra/nginx/nginx.conf
  lb:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/lb-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ---- Web (Next.js war-room) ------------------------------------------
  # Built from apps/web/Dockerfile. For local dev you can also skip this and run
  # `cd apps/web && npm run dev` against the api on :8000.
  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000      # what the browser calls (the lb)
      ATLAS_API_INTERNAL_URL: http://lb               # what the BFF calls, in-network
    depends_on:
      - lb
    restart: unless-stopped

volumes:
  qdrant_storage:
  langfuse_db_data:
  atlas_pg_data:
