name: Atlas CI

# Every push and pull request: backend lint + tests, the retrieval eval gate, and the
# frontend lint + typecheck + production build. All offline — no API keys, no LLM
# calls, no cost. On main, a green run is what lets Render deploy the API
# (render.yaml: autoDeployTrigger: checksPass) and what triggers deploy.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    # Real Postgres + Redis: the atomic rate limiter (SQL / Lua), refresh-token
    # rotation and encryption-at-rest tests only mean something against real servers.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_ci_pw
          POSTGRES_DB: atlas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ATLAS_OFFLINE_EMBED: "1"
      ATLAS_OFFLINE_LLM: "1"
      ATLAS_OFFLINE_WEB: "1"
      ATLAS_TEST_DATABASE_URL: postgresql://atlas:atlas_ci_pw@localhost:5432/atlas_test
      ATLAS_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Dependency audit (known CVEs, advisory)
        run: |
          pip install -q pip-audit
          pip-audit --progress-spinner off --skip-editable || echo "::warning::pip-audit found advisories (see log)"
      - name: Lint (ruff)
        run: python -m ruff check atlas tests evals
      - name: Tests (offline, with real Postgres + Redis)
        run: python -m pytest -q -p no:warnings -rs --cov=atlas --cov-report=term

  eval-gate:
    name: Retrieval eval gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    env:
      ATLAS_OFFLINE_EMBED: "1"
      ATLAS_OFFLINE_LLM: "1"
      ATLAS_OFFLINE_WEB: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      # Golden-set hit rate, MRR and rank-aware context precision must stay above
      # their floors (atlas/eval/retrieval_eval.py: GATE), or the build fails.
      - name: Retrieval quality must not regress
        run: python -m atlas.eval.retrieval_eval --gate

  web:
    name: Frontend — lint + typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: apps/web/.nvmrc  # same Node/npm as dev: the lockfile is npm-11 format
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        # On failure, surface npm's own error lines as an annotation (readable on the
        # run page and via the API) instead of a bare "exit code 1".
        run: |
          set -o pipefail
          echo "node $(node --version) / npm $(npm --version)"
          npm ci 2>&1 | tee "$RUNNER_TEMP/npm-ci.log" || {
            msg=$(grep -E '^npm (error|ERR!)' "$RUNNER_TEMP/npm-ci.log" | head -15 \
              | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=npm ci failed::${msg:-see log}"
            exit 1
          }
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://atlas-api-kpiq.onrender.com
