name: Atlas Deploy

# Continuous deployment, gated on CI. Runs only when "Atlas CI" finishes green for a
# push to main, and orders the release:
#   1. deploy-api  — tell Render to deploy THIS commit (deploy hook ?ref=<sha>), wait
#                    until the live API reports it, then smoke-test the API
#   2. deploy-web  — deploy the Next.js frontend to Vercel (after the API it calls)
#   3. smoke-web   — pages load, the bundle points at the production API, CORS works
#
# Why Actions drives Render instead of Render's "deploy when checks pass": Render
# waits for every check on the commit — including this workflow — while this workflow
# waits for Render. That deadlock is avoided by keeping Render auto-deploy off
# (render.yaml: autoDeployTrigger: off) and deploying from here.

on:
  workflow_run:
    workflows: ["Atlas CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: # manual re-run of a release from the Actions tab

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  API_URL: https://atlas-api-kpiq.onrender.com
  WEB_URL: https://atlas-web-lake.vercel.app
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy-api:
    name: Deploy API (Render) + smoke test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production-api
      url: https://atlas-api-kpiq.onrender.com/health/ready
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Does the API need a new deploy?
        id: need
        run: |
          live=$(curl -s -m 90 "$API_URL/health" | jq -r '.commit // empty' || true)
          echo "Live API commit: ${live:-unknown}"
          if [ -n "$live" ] && git cat-file -e "${live}^{commit}" 2>/dev/null \
             && git diff --quiet "$live" "$SHA" -- apps/api render.yaml; then
            echo "No backend changes since ${live:0:7} — skipping the API deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger Render deploy of this commit
        if: steps.need.outputs.deploy == 'true'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error title=Missing secret::Add RENDER_DEPLOY_HOOK_URL (Render → atlas-api → Settings → Deploy Hook) as a GitHub Actions secret."
            exit 1
          fi
          code=$(curl -s -o "$RUNNER_TEMP/hook.json" -w "%{http_code}" -X POST "${HOOK}&ref=${SHA}")
          echo "Render deploy hook → HTTP $code"
          case "$code" in
            200) echo "Deploy started: $(jq -r '.deploy.id // .id // "?"' "$RUNNER_TEMP/hook.json" 2>/dev/null)";;
            202) echo "Queued behind a deploy already in progress.";;
            *) echo "::error title=Render deploy hook failed::HTTP $code"; exit 1;;
          esac
      - name: Wait until the live API runs this commit
        if: steps.need.outputs.deploy == 'true'
        run: |
          for i in $(seq 1 75); do
            live=$(curl -s -m 60 "$API_URL/health" | jq -r '.commit // empty' || true)
            if [ "$live" = "$SHA" ]; then echo "Live on ${SHA:0:7} after ~$((i * 20))s."; exit 0; fi
            sleep 20
          done
          echo "::error title=API not live::Render did not serve ${SHA:0:7} within 25 minutes (live: ${live:-unknown}). Check the Render deploy logs."
          exit 1
      - name: Readiness — LLM, Postgres and web search configured
        run: |
          for attempt in 1 2 3; do
            r=$(curl -s -m 90 "$API_URL/health/ready" || true)
            echo "$r" | jq -e '.ready == true' >/dev/null 2>&1 && break
            echo "not ready yet (attempt $attempt)"; sleep 15
          done
          echo "$r" | jq .
          echo "$r" | jq -e '.ready == true' >/dev/null || { echo "::error::API not ready"; exit 1; }
          echo "$r" | jq -e '.checks.database.backend == "postgres"' >/dev/null \
            || { echo "::error::API is not using Postgres — check DATABASE_URL on Render"; exit 1; }
          echo "$r" | jq -e '.checks.web_search.configured == true' >/dev/null \
            || { echo "::error::TAVILY_API_KEY is not set on Render"; exit 1; }
      - name: Web search actually works (live Tavily probe)
        run: |
          w=$(curl -s -m 90 "$API_URL/health/web")
          echo "$w" | jq .
          echo "$w" | jq -e '.ok == true' >/dev/null \
            || { echo "::error::Web search failing: $(echo "$w" | jq -r .detail)"; exit 1; }

  deploy-web:
    name: Deploy frontend (Vercel)
    needs: deploy-api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://atlas-web-lake.vercel.app
    defaults:
      run:
        working-directory: apps/web
    env:
      # Identifiers, not secrets (the token is the secret).
      VERCEL_ORG_ID: team_hwBCYgSP1YkMGmJLAcDodMZu
      VERCEL_PROJECT_ID: prj_wAGfsG73LQFnGE3YTcbwEwGWIhwO
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: apps/web/.nvmrc
      # Remote build on Vercel, so the production NEXT_PUBLIC_API_URL set in the
      # Vercel project is the one baked in.
      - name: Deploy (production)
        run: npx --yes vercel@latest deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"

  smoke-web:
    name: Smoke-test live website
    needs: deploy-web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pages load
        run: |
          for path in / /research; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 60 --retry 3 --retry-all-errors "$WEB_URL$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::$WEB_URL$path returned $code"; exit 1; }
          done
      - name: Frontend points at the production API (not localhost)
        run: |
          chunks=$(curl -s -m 60 --retry 3 "$WEB_URL/research" | grep -o '/_next/static/chunks/[^"]*\.js' | sort -u)
          for c in $chunks; do
            if curl -s -m 60 "$WEB_URL$c" | grep -q "$API_URL"; then echo "API URL found in $c"; exit 0; fi
          done
          echo "::error::No bundle references $API_URL — NEXT_PUBLIC_API_URL is wrong in Vercel"
          exit 1
      - name: Browser may call the API (CORS)
        run: |
          # The free Render instance may be waking from sleep: allow a slow first answer.
          for attempt in 1 2 3; do
            allowed=$(curl -s -m 90 -D - -o /dev/null -X OPTIONS "$API_URL/research/stream" \
              -H "Origin: $WEB_URL" -H "Access-Control-Request-Method: GET" \
              | tr -d '\r' | awk -F': ' 'tolower($1)=="access-control-allow-origin"{print $2}')
            [ "$allowed" = "$WEB_URL" ] && { echo "CORS allows $WEB_URL"; exit 0; }
            echo "attempt $attempt: access-control-allow-origin=${allowed:-<none>}"; sleep 15
          done
          echo "::error::CORS does not allow $WEB_URL"
          exit 1
